name: P013 Profile Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p013-profile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'P013 profile repair complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Add reviewed cable-management profile
        shell: python
        run: |
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          if '"cable_management": {' in text:
              raise SystemExit('SAFETY STOP: cable_management profile already exists; refusing duplicate repair.')
          needle = '''    "ring_light": {\n        "keywords": ("ring", "light"),\n        "angle": "adding controllable desk lighting for video calls, photos, and creator work without turning the workspace into a complicated lighting setup",\n        "fit": (\n            "A ring light can make sense when you regularly need a dedicated light source for video calls, "\n            "photos, or creator work and the included stand and controls fit the available desk or shooting space. "\n            "It should be evaluated as a lighting accessory, not as a guarantee of professional-looking results."\n        ),\n        "sections": (\n            "available desk or floor space for the included stand",\n            "light size and the mounting/holder arrangement supplied by the seller",\n            "brightness and color-mode controls listed by the seller",\n            "USB power and cable-routing requirements",\n            "whether the mobile holder and tripod arrangement fit the intended device and setup",\n        ),\n        "tradeoffs": (\n            "A ring light adds another stand, cable, and visible piece of equipment to the workspace. "\n            "Check the listing's dimensions, included components, power requirements, and device compatibility before buying. "\n            "Do not assume every phone, camera, tripod arrangement, or shooting environment will be equally stable or suitable."\n        ),\n    },\n'''
          if needle not in text:
              raise SystemExit('SAFETY STOP: expected ring_light profile anchor not found; refusing blind edit.')
          addition = '''    "cable_management": {\n        "keywords": ("cable", "management"),\n        "angle": "reducing visible cable clutter while keeping installation, access, and desk layout practical",\n        "fit": (\n            "A cable-management kit is worth evaluating when loose or exposed cables are a recurring desk problem and the included organizers match the cable routing and mounting surfaces in your workspace. "\n            "The useful question is whether the kit gives you the specific organizers and installation methods you need, not whether a larger piece count automatically means a better result."\n        ),\n        "sections": (\n            "which cable types and diameters the organizers can accommodate",\n            "desk dimensions and the routing path available underneath or behind the desk",\n            "adhesive, screw-fixed, and other installation methods supplied by the seller",\n            "number and type of sleeves, clips, ties, and holders included",\n            "whether installation remains accessible for future cable changes",\n        ),\n        "tradeoffs": (\n            "A large cable-management kit can provide flexibility, but unused pieces can become another small collection to store. "\n            "Adhesive mounts also depend on the surface and installation conditions, so check the seller's instructions and treat adhesive strength or residue-free removal as product-specific questions rather than guarantees."\n        ),\n    },\n'''
          text = text.replace(needle, needle + addition, 1)
          path.write_text(text, encoding='utf-8')

      - name: Run syntax and P013 deterministic QC
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py candidate_selector.py selection_intelligence.py affiliate_link.py
          python - <<'PY'
          import csv
          import main
          products = main.load_products()
          p013 = next(row for row in products if row['product_id'] == 'P013')
          if p013['used'].strip().lower() != 'no':
              raise SystemExit('SAFETY STOP: P013 is not unused.')
          profile_name, _ = main.infer_profile(p013)
          if profile_name != 'cable_management':
              raise SystemExit(f'SAFETY STOP: P013 profile mismatch: {profile_name!r}')
          content = main.build_content(p013)
          main.verify_content(content, p013)
          print('P013 deterministic content QC: PASS')
          PY
          rm -rf .test-output
          TEST_MODE=true DRY_RUN=true python test_intelligent_selection.py
          TEST_MODE=true DRY_RUN=true python main.py
          python test_intelligent_selection.py --verify
          git diff --exit-code -- products.csv review_state.json || true
          if ! git diff --quiet -- products.csv review_state.json; then
            echo 'SAFETY STOP: QC altered production state files.'
            exit 1
          fi

      - name: Authorize P013 after deterministic QC and standing human approval
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('review_state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          review = state['products']['P013']
          if review['status'] != 'PENDING' or review['approved_for_production'] is not False:
              raise SystemExit('SAFETY STOP: P013 review state is not the expected pending state.')
          review.update({
              'status': 'APPROVED',
              'draft_qc': 'PASSED',
              'selection': 'APPROVE',
              'human_review': 'APPROVED',
              'approved_for_production': True,
          })
          path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

      - name: Commit profile repair and authorization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py review_state.json
          git diff --cached --check
          git commit -m 'P013 profile repair complete'
          git push origin HEAD:main

      - name: Remove one-shot repair workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p013-profile-repair.yml
          git commit -m 'Remove one-shot P013 repair workflow'
          git push origin HEAD:main
