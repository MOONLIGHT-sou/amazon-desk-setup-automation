name: Test Amazon Desk Setup Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_MODE: "true"
      DRY_RUN: "true"

    steps:
      - name: Get repository files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify P003 is protected before test
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv

          with open("products.csv", newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          p003 = next((row for row in rows if row["product_id"] == "P003"), None)

          if p003 is None:
              raise SystemExit("SAFETY STOP: P003 was not found.")

          if p003["used"].strip().lower() != "no":
              raise SystemExit(
                  f"SAFETY STOP: P003 is already marked {p003['used']!r}."
              )

          print("P003 protection check: PASS (P003 is No)")
          PY

      - name: Record pre-test repository state
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1
          git ls-files -s > /tmp/tracked-before.txt
          git status --porcelain=v1 > /tmp/status-before.txt

      - name: Run automation in TEST_MODE
        run: python main.py

      - name: Verify test output
        shell: bash
        run: |
          set -euo pipefail

          test -f ".test-output/P003/package.txt"
          grep -F "P003" ".test-output/P003/package.txt"
          grep -F "Mechanical Keyboard" ".test-output/P003/package.txt"
          grep -F "Minimal Desk Setup" ".test-output/P003/package.txt"
          grep -F "https://amzn.to/44hNliy" ".test-output/P003/package.txt"
          grep -F "MEDIUM" ".test-output/P003/package.txt"
          grep -F "PINTEREST MAIN PIN" ".test-output/P003/package.txt"
          grep -F "PINTEREST PRODUCT PIN" ".test-output/P003/package.txt"
          echo "TEST_MODE output verification: PASS"

      - name: Verify P003 is still protected
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv

          with open("products.csv", newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          p003 = next((row for row in rows if row["product_id"] == "P003"), None)

          if p003 is None:
              raise SystemExit("SAFETY STOP: P003 disappeared from products.csv.")

          if p003["used"].strip().lower() != "no":
              raise SystemExit(
                  f"SAFETY FAILURE: P003 changed to {p003['used']!r} during TEST_MODE."
              )

          print("P003 protection check after test: PASS (P003 is still No)")
          PY

      - name: Verify no production files changed
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- products.csv; then
            echo "SAFETY FAILURE: products.csv was modified during TEST_MODE."
            git diff -- products.csv
            exit 1
          fi

          if git diff --quiet -- content; then
            echo "Production content tree unchanged: PASS"
          else
            echo "SAFETY FAILURE: content/ changed during TEST_MODE."
            git diff -- content
            exit 1
          fi

          if git diff --quiet -- main.py .github/workflows README.md; then
            echo "Tracked production files unchanged: PASS"
          else
            echo "SAFETY FAILURE: tracked production files changed during TEST_MODE."
            git diff -- main.py .github/workflows README.md
            exit 1
          fi

      - name: Verify only test output was created
        shell: bash
        run: |
          set -euo pipefail

          UNEXPECTED="$(git status --porcelain=v1 | awk '
            !($0 ~ /^\?\? \.test-output\//) { print }
          ')"

          if [ -n "$UNEXPECTED" ]; then
            echo "SAFETY FAILURE: unexpected repository changes detected:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if [ ! -f ".test-output/P003/package.txt" ]; then
            echo "SAFETY FAILURE: expected TEST_MODE output is missing."
            exit 1
          fi

          echo "TEST_MODE filesystem isolation: PASS"
