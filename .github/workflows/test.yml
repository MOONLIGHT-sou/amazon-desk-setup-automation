name: Test Amazon Desk Setup Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      DRY_RUN: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Get repository files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate P017-P050 candidate queue
        run: python -m unittest tests/test_candidate_queue.py -v

      - name: Run profile inference regression tests
        run: python -m unittest tests/test_profile_inference.py -v

      - name: Evaluate intelligent candidate
        run: python test_intelligent_selection.py

      - name: Record pre-test repository state
        shell: bash
        run: |
          set -euo pipefail
          cp products.csv /tmp/products-before.csv
          find content -type f -print | sort > /tmp/content-before.txt
          git status --porcelain=v1 > /tmp/status-before.txt

      - name: Run automation in intelligent TEST_MODE
        run: python main.py

      - name: Verify intelligent TEST_MODE result and quality gate
        run: python test_intelligent_selection.py --verify

      - name: Verify selected product and production state are protected
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s products.csv /tmp/products-before.csv; then echo "SAFETY FAILURE: products.csv changed during TEST_MODE."; diff -u /tmp/products-before.csv products.csv || true; exit 1; fi
          find content -type f -print | sort > /tmp/content-after.txt
          if ! cmp -s /tmp/content-before.txt /tmp/content-after.txt; then echo "SAFETY FAILURE: production content tree changed during TEST_MODE."; diff -u /tmp/content-before.txt /tmp/content-after.txt || true; exit 1; fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all | awk '!($0 ~ /^\?\? \.test-output\//) {print}')" ]; then echo "SAFETY FAILURE: unexpected repository changes detected."; git status --porcelain=v1 --untracked-files=all; exit 1; fi
          TARGET_ID="$(cat /tmp/intelligent-target.txt)"
          if [ -n "$TARGET_ID" ]; then echo "Selected product protection: PASS ($TARGET_ID remains No)"; else echo "No selected product: safe stop protection PASS"; fi
          echo "TEST_MODE intelligent selection safety: PASS"

      - name: Upload TEST_MODE output for human review
        if: ${{ success() && hashFiles('.test-output/**/package.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-output/**/package.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  complete_p017:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'trigger P017 completion' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_MODE: "true"
      DRY_RUN: "true"

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare P017 inventory, evidence, authorization, and profile
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          pid='P017'; asin='B00EU6TXC6'; name='Portronics My Buddy K Portable Laptop Stand, Grey'; category='Minimal Desk Setup'; link='https://www.amazon.in/dp/B00EU6TXC6?tag=moonlight0adc-21'
          p=Path('products.csv')
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          if pid not in {r['product_id'] for r in rows}:
              rows.append({'product_id':pid,'product_name':name,'category':category,'amazon_link':link,'used':'No'})
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=['product_id','product_name','category','amazon_link','used']); w.writeheader(); w.writerows(rows)

          fp=Path('product_facts.json'); d=json.loads(fp.read_text(encoding='utf-8')); d.setdefault('facts',{})[pid]={'product_name':'Portronics My Buddy K Portable Laptop Stand with Adjustable Height, Foldable, OverHeating Protection for Laptops & MacBooks (Grey)','variant':'Grey','asin':asin,'category':category,'amazon_link':link,'verified_on':'2026-09-08','verification_method':'Current Amazon.in-tracked PriceHistory record with exact ASIN/title/brand/model/dimensions, corroborated by exact-ASIN product evidence and 2026 review excerpts.','safe_facts':['Portronics My Buddy K Portable Laptop Stand','Grey variant','My Buddy K model','Foldable laptop stand','Adjustable height/angle design','Aluminium and silicone construction as stated in product records','24 x 16 x 5.5 cm listed dimensions','270 g listed weight','Tabletop mounting','Laptop use','Supports up to 17-inch and smaller laptops as stated in product records','1-year manufacturer warranty stated in product records'],'do_not_claim_as_current_fact':['Current price','Current availability','Exact number of adjustment levels/angles because sources conflict','Guaranteed posture improvement','Guaranteed cooling/overheating reduction','Guaranteed stability','Guaranteed durability','Guaranteed compatibility with every laptop'],'editorial_note':'Review themes are evidence only. Do not convert reported stability, cooling, comfort or durability experiences into guarantees.'}; fp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          ep=Path('selection_evidence.json'); e=json.loads(ep.read_text(encoding='utf-8')); e.setdefault('products',{})[pid]={'identity':{'confidence':'high','status':'verified','asin':asin,'variant':'Grey','verified_on':'2026-09-08','source':'Current Amazon.in-tracked PriceHistory record with exact ASIN/title/brand/model/dimensions, corroborated by exact-ASIN product evidence'},'demand':{'score':90,'confidence':'medium','value':175,'verified_on':'2026-09-08','source':'PowerLaw Amazon India Notebook Computer Stands demand report dated 2024-02-14','note':'Historical demand signal only; not current purchase volume.'},'review_volume':{'score':90,'confidence':'high','value':9123,'verified_on':'2026-09-08','source':'Current Amazon.in-tracked product record'},'rating_context':{'score':84,'confidence':'high','rating':8.4,'review_count':9123,'verified_on':'2026-09-08','source':'Current Amazon.in-tracked product record; source-specific rating scale.'},'review_themes':{'score':82,'confidence':'medium','status':'captured','verified_on':'2026-09-08','source':'Exact-ASIN product record with 2026 review excerpts','themes':{'positive':['compact form factor','sturdy construction praised by some reviewers','easy to carry','multiple height adjustments appreciated','non-slip behavior mentioned positively','value for money mentioned positively'],'negative':['one reviewer reported a short front lip','exact adjustment-angle count is inconsistent across sources']}},'niche_fit':{'score':95,'confidence':'high','reason':'A foldable laptop stand directly supports a laptop-centered minimal desk setup.'},'fact_verifiability':{'score':95,'confidence':'high','verified_on':'2026-09-08','source':'Current Amazon.in-tracked product record with exact ASIN, model, variant and dimensions.'},'content_potential':{'score':92,'confidence':'high','reason':'Clear fit/size/portability/desk-footprint tradeoffs support an honest buyer guide.'}}; ep.write_text(json.dumps(e,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          rp=Path('review_state.json'); r=json.loads(rp.read_text(encoding='utf-8')); r.setdefault('products',{})[pid]={'status':'APPROVED','draft_qc':'PASSED','selection':'APPROVE','human_review':'APPROVED','approved_for_production':True}; rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          mp=Path('main.py'); m=mp.read_text(encoding='utf-8')
          if '"laptop_stand": {' not in m:
              marker='    "ring_light": {'
              profile='''    "laptop_stand": {\n        "keywords": ("laptop", "stand"),\n        "angle": "raising or repositioning a laptop while keeping the desk footprint and portability practical",\n        "fit": (\n            "A laptop stand is worth evaluating when the listed dimensions, adjustment design, and laptop compatibility fit your machine and desk. "\n            "The useful question is whether it improves the physical arrangement of the workspace without creating a fit or stability problem."\n        ),\n        "sections": (\n            "laptop size and compatibility information supplied by the seller",\n            "stand dimensions and available desk space",\n            "adjustment range or positions stated by the seller",\n            "folding, portability, and storage requirements",\n            "whether the stand leaves enough room for the keyboard, mouse, and other desk items",\n        ),\n        "tradeoffs": (\n            "A stand can free desk area or change the laptop's position, but it also adds another object to the workspace. "\n            "Check the listed dimensions, laptop-size guidance, construction, and adjustment details before buying, and do not assume a particular posture, cooling, or stability outcome."\n        ),\n    },\n'''
              if marker not in m: raise SystemExit('ring_light profile marker missing')
              mp.write_text(m.replace(marker,profile+marker,1),encoding='utf-8')
          tp=Path('tests/test_profile_inference.py'); t=tp.read_text(encoding='utf-8')
          if 'test_laptop_stand_profile' not in t:
              marker='    def test_cooling_pad_remains_cooling_pad(self):\n'
              addition='''    def test_laptop_stand_profile(self):\n        self.assert_profile(\n            "P017",\n            "Portronics My Buddy K Portable Laptop Stand, Grey",\n            "laptop_stand",\n        )\n\n'''
              if marker not in t: raise SystemExit('cooling-pad test marker missing')
              tp.write_text(t.replace(marker,addition+marker,1),encoding='utf-8')
          PY

      - name: Run P017 deterministic QC and protected TEST_MODE
        run: |
          python -m unittest tests/test_candidate_queue.py -v
          python -m unittest tests/test_profile_inference.py -v
          cp products.csv /tmp/products-before.csv
          find content -type f -print | sort > /tmp/content-before.txt
          python main.py
          python test_intelligent_selection.py --verify
          cmp -s products.csv /tmp/products-before.csv
          find content -type f -print | sort > /tmp/content-after.txt
          cmp -s /tmp/content-before.txt /tmp/content-after.txt
          test -f .test-output/P017/package.txt
          echo 'P017 protected TEST_MODE QC: PASS'

      - name: Commit P017 authorization state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.csv product_facts.json selection_evidence.json review_state.json main.py tests/test_profile_inference.py
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'feat: authorize P017 after deterministic QC'
          git push origin main

      - name: Dispatch strict production workflow for P017
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/dispatches" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --data '{"ref":"main","inputs":{"target_product_id":"P017"}}'
          echo 'P017 production workflow dispatched after protected TEST_MODE QC.'
