name: Test Amazon Desk Setup Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      DRY_RUN: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Get repository files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Evaluate intelligent candidate
        run: python test_intelligent_selection.py

      - name: Record pre-test repository state
        shell: bash
        run: |
          set -euo pipefail
          cp products.csv /tmp/products-before.csv
          find content -type f -print | sort > /tmp/content-before.txt
          git status --porcelain=v1 > /tmp/status-before.txt

      - name: Run automation in intelligent TEST_MODE
        run: python main.py

      - name: Verify intelligent TEST_MODE result and quality gate
        run: python test_intelligent_selection.py --verify

      - name: Verify selected product and production state are protected
        shell: bash
        run: |
          set -euo pipefail

          if ! cmp -s products.csv /tmp/products-before.csv; then
            echo "SAFETY FAILURE: products.csv changed during TEST_MODE."
            diff -u /tmp/products-before.csv products.csv || true
            exit 1
          fi

          find content -type f -print | sort > /tmp/content-after.txt
          if ! cmp -s /tmp/content-before.txt /tmp/content-after.txt; then
            echo "SAFETY FAILURE: production content tree changed during TEST_MODE."
            diff -u /tmp/content-before.txt /tmp/content-after.txt || true
            exit 1
          fi

          if [ -n "$(git status --porcelain=v1 --untracked-files=all | awk '!($0 ~ /^\?\? \.test-output\//) {print}')" ]; then
            echo "SAFETY FAILURE: unexpected repository changes detected."
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

          TARGET_ID="$(cat /tmp/intelligent-target.txt)"
          if [ -n "$TARGET_ID" ]; then
            echo "Selected product protection: PASS ($TARGET_ID remains No)"
          else
            echo "No selected product: safe stop protection PASS"
          fi

          echo "TEST_MODE intelligent selection safety: PASS"

      - name: Upload TEST_MODE output for human review
        if: ${{ success() && hashFiles('.test-output/**/package.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-output/**/package.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
