name: Test Amazon Desk Setup Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automation
        run: python main.py

      - name: Save updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.csv content/

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update product content and usage status"
            git push
          fi
