name: Human Review Gate - Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'review_state.json'
      - 'products.csv'
      - '.github/workflows/human-review-gate-test.yml'

permissions:
  contents: read

jobs:
  gate:
    name: Verify fail-closed human review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify current first-unused product is pending review
        run: |
          python - <<'PY'
          import csv, json
          products = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next((row for row in products if row.get('used', '').strip().lower() == 'no'), None)
          assert target is not None, 'No unused candidate exists.'
          state = json.load(open('review_state.json', encoding='utf-8'))
          review = state['products'][target['product_id']]
          assert review['status'] == 'PENDING_HUMAN_REVIEW'
          assert review['human_review'] == 'REQUIRED'
          assert review['approved_for_production'] is False
          print(f"{target['product_id']} PENDING_HUMAN_REVIEW state: PASS")
          print('Production approval: BLOCKED')
          PY

      - name: Verify approval cannot be inferred from draft QC
        run: |
          python - <<'PY'
          import csv, json
          products = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next(row for row in products if row.get('used', '').strip().lower() == 'no')
          state = json.load(open('review_state.json', encoding='utf-8'))
          review = state['products'][target['product_id']]
          assert review['status'] != 'APPROVED'
          assert review['approved_for_production'] is False
          print(f"QC does not imply human approval: PASS ({target['product_id']})")
          PY
