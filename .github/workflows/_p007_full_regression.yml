name: Temporary P007 Full Regression

on:
  push:
    paths:
      - '.github/workflows/_p007_full_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run P007 regression and isolated production safety
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile main.py candidate_selector.py selection_intelligence.py affiliate_link.py
          python - <<'PY'
          import csv, json
          import main
          from candidate_selector import select_candidate
          from selection_intelligence import build_report
          from affiliate_link import validate_affiliate_link
          rows = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next(r for r in rows if r['used'].lower() == 'no')
          assert target['product_id'] == 'P007'
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts']['P007']
          assert facts['asin'] == 'B07YWS9SP9'
          assert facts['amazon_link'] == target['amazon_link']
          assert 'cooling_pad' in main.PRODUCT_PROFILES
          selected = select_candidate(rows, build_report())
          assert selected and selected['product']['product_id'] == 'P007'
          validate_affiliate_link(target['amazon_link'], facts['asin'], 'moonlight0adc-21')
          review = json.load(open('review_state.json', encoding='utf-8'))['products']['P007']
          assert review['human_review'] == 'APPROVED'
          assert review['approved_for_production'] is False
          print('Static gates: PASS')
          PY
          cp products.csv /tmp/products.before.csv
          cp review_state.json /tmp/review.before.json
          TEST_MODE=true DRY_RUN=false python main.py
          test -f .test-output/P007/package.txt
          python - <<'PY'
          import csv, json
          from pathlib import Path
          text = Path('.test-output/P007/package.txt').read_text(encoding='utf-8')
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts']['P007']
          for item in ('PRODUCT CONTENT PACKAGE','Product ID: P007',facts['product_name'],facts['asin'],facts['amazon_link'],'PINTEREST MAIN PIN','PINTEREST PRODUCT PIN','CONTENT QUALITY','Human review before publication: REQUIRED','As an Amazon Associate I earn from qualifying purchases.','(paid link)'):
              assert item in text, item
          assert 'TODO' not in text and 'PLACEHOLDER' not in text
          assert 'specific temperature reduction' in text
          assert 'gaming-performance gain' in text
          assert next(r for r in csv.DictReader(open('products.csv', newline='', encoding='utf-8')) if r['product_id']=='P007')['used'].lower() == 'no'
          print('Draft QC: PASS')
          PY
          cmp --silent products.csv /tmp/products.before.csv
          cmp --silent review_state.json /tmp/review.before.json
          python - <<'PY'
          import csv, hashlib, json, os, shutil, tempfile
          from pathlib import Path
          import main
          def read_rows(p): return list(csv.DictReader(p.open(newline='', encoding='utf-8')))
          def file_hash(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          repo=Path.cwd(); before_products=(repo/'products.csv').read_bytes(); before_review=(repo/'review_state.json').read_bytes()
          before_content={str(p.relative_to(repo/'content')):file_hash(p) for p in (repo/'content').rglob('*') if p.is_file()} if (repo/'content').exists() else {}
          before=read_rows(repo/'products.csv'); target=next(r for r in before if r['used'].lower()=='no'); assert target['product_id']=='P007'; before_by={r['product_id']:dict(r) for r in before}
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); (root/'products.csv').write_bytes(before_products)
              review=json.loads(before_review.decode()); review['products']['P007'].update(status='APPROVED',human_review='APPROVED',approved_for_production=True,draft_qc='PASSED'); (root/'review_state.json').write_text(json.dumps(review),encoding='utf-8')
              shutil.copyfile(repo/'selection_evidence.json',root/'selection_evidence.json'); shutil.copyfile(repo/'product_facts.json',root/'product_facts.json')
              os.environ.update(TEST_MODE='false',DRY_RUN='false',TARGET_PRODUCT_ID='P007'); old=Path.cwd(); os.chdir(root)
              try: main.main()
              finally: os.chdir(old)
              after=read_rows(root/'products.csv'); after_by={r['product_id']:dict(r) for r in after}; assert after_by['P007']['used'].lower()=='yes'; assert set(after_by)==set(before_by)
              for pid,br in before_by.items():
                  ar=after_by[pid]
                  if pid=='P007': expected=dict(br); expected['used']='Yes'; assert ar==expected
                  else: assert ar==br
              package=root/'content/P007/package.txt'; assert package.is_file() and package.stat().st_size>0
              text=package.read_text(encoding='utf-8'); facts=json.load(open(root/'product_facts.json',encoding='utf-8'))['facts']['P007']
              for value in ('P007',facts['product_name'],facts['asin'],facts['amazon_link'],'As an Amazon Associate I earn from qualifying purchases.'): assert value in text
          assert (repo/'products.csv').read_bytes()==before_products; assert (repo/'review_state.json').read_bytes()==before_review
          after_content={str(p.relative_to(repo/'content')):file_hash(p) for p in (repo/'content').rglob('*') if p.is_file()} if (repo/'content').exists() else {}; assert after_content==before_content
          print('Isolated production-path safety: PASS')
          PY
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          echo 'Artifact hygiene: PASS'
