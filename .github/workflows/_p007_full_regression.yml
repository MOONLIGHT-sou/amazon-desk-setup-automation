name: Temporary P007 Full Regression

on:
  push:
    paths:
      - '.github/workflows/_p007_full_regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile and validate current code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile main.py candidate_selector.py selection_intelligence.py affiliate_link.py
          python - <<'PY'
          import csv, json
          import main
          from candidate_selector import select_candidate
          from selection_intelligence import build_report
          from affiliate_link import validate_affiliate_link

          with open('products.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          target = next(r for r in rows if r['used'].strip().lower() == 'no')
          assert target['product_id'] == 'P007', target
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts']['P007']
          assert facts['asin'] == 'B07YWS9SP9'
          assert facts['amazon_link'] == target['amazon_link']
          assert 'cooling_pad' in main.PRODUCT_PROFILES
          selection = select_candidate(rows, build_report())
          assert selection is not None
          assert selection['product']['product_id'] == 'P007'
          assert validate_affiliate_link(target['amazon_link'])
          review = json.load(open('review_state.json', encoding='utf-8'))['products']['P007']
          assert review['human_review'] == 'APPROVED'
          assert review['approved_for_production'] is False
          print('Static gate validation: PASS')
          PY

      - name: Run draft QC in TEST_MODE
        env:
          TEST_MODE: 'true'
          DRY_RUN: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cp products.csv /tmp/products.before.csv
          cp review_state.json /tmp/review.before.json
          python main.py
          test -f .test-output/P007/package.txt
          python - <<'PY'
          import csv, json
          from pathlib import Path
          text = Path('.test-output/P007/package.txt').read_text(encoding='utf-8')
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts']['P007']
          required = [
              'PRODUCT CONTENT PACKAGE', 'Product ID: P007', facts['product_name'],
              facts['asin'], facts['amazon_link'], 'PINTEREST MAIN PIN',
              'PINTEREST PRODUCT PIN', 'CONTENT QUALITY',
              'Human review before publication: REQUIRED',
              'As an Amazon Associate I earn from qualifying purchases.', '(paid link)'
          ]
          for item in required:
              assert item in text, item
          assert 'TODO' not in text and 'PLACEHOLDER' not in text
          assert 'no promise of guaranteed temperature' in text
          assert 'specific temperature reduction' in text
          assert 'gaming-performance gain' in text
          with open('products.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert next(r for r in rows if r['product_id'] == 'P007')['used'].lower() == 'no'
          print('P007 Draft QC: PASS')
          PY
          cmp --silent products.csv /tmp/products.before.csv
          cmp --silent review_state.json /tmp/review.before.json

      - name: Run isolated approved-production simulation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, shutil, tempfile
          from pathlib import Path
          import main

          def rows(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))
          def h(path):
              d = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      d.update(chunk)
              return d.hexdigest()

          repo = Path.cwd()
          before_products = (repo/'products.csv').read_bytes()
          before_review = (repo/'review_state.json').read_bytes()
          before_content = {str(p.relative_to(repo/'content')): h(p) for p in (repo/'content').rglob('*') if p.is_file()} if (repo/'content').exists() else {}
          before = rows(repo/'products.csv')
          target = next(r for r in before if r['used'].lower() == 'no')
          assert target['product_id'] == 'P007'
          target_id = target['product_id']
          before_by = {r['product_id']: dict(r) for r in before}

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              (root/'products.csv').write_bytes(before_products)
              review = json.loads(before_review.decode())
              review['products'][target_id].update(status='APPROVED', human_review='APPROVED', approved_for_production=True, draft_qc='PASSED')
              (root/'review_state.json').write_text(json.dumps(review), encoding='utf-8')
              shutil.copyfile(repo/'selection_evidence.json', root/'selection_evidence.json')
              shutil.copyfile(repo/'product_facts.json', root/'product_facts.json')
              os.environ.update(TEST_MODE='false', DRY_RUN='false', TARGET_PRODUCT_ID=target_id)
              old = Path.cwd()
              os.chdir(root)
              try:
                  main.main()
              finally:
                  os.chdir(old)
              after = rows(root/'products.csv')
              after_by = {r['product_id']: dict(r) for r in after}
              assert after_by[target_id]['used'].lower() == 'yes'
              assert set(after_by) == set(before_by)
              for pid, br in before_by.items():
                  ar = after_by[pid]
                  if pid == target_id:
                      expected = dict(br); expected['used'] = 'Yes'
                      assert ar == expected, (br, ar)
                  else:
                      assert ar == br, pid
              package = root/'content'/target_id/'package.txt'
              assert package.is_file() and package.stat().st_size > 0
              text = package.read_text(encoding='utf-8')
              facts = json.load(open(root/'product_facts.json', encoding='utf-8'))['facts'][target_id]
              for value in (target_id, facts['product_name'], facts['asin'], facts['amazon_link'], 'As an Amazon Associate I earn from qualifying purchases.'):
                  assert value in text, value

          assert (repo/'products.csv').read_bytes() == before_products
          assert (repo/'review_state.json').read_bytes() == before_review
          after_content = {str(p.relative_to(repo/'content')): h(p) for p in (repo/'content').rglob('*') if p.is_file()} if (repo/'content').exists() else {}
          assert after_content == before_content
          print('Isolated production-path safety: PASS')
          print('Verified P007 exact No -> Yes in isolation, unrelated rows unchanged, and real repository state untouched.')
          PY

      - name: Verify no bytecode or temporary artifacts
        run: |
          set -euo pipefail
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          echo 'Artifact hygiene: PASS'

      - name: Cleanup temporary regression workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/_p007_full_regression.yml
          git commit -m 'chore: remove temporary P007 regression workflow'
          git push origin HEAD:main
