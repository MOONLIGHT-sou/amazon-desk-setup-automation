name: Publishing - Pinterest

on:
  workflow_dispatch:
    inputs:
      target_product_id:
        description: "Approved product package to publish to Pinterest"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pinterest-publishing-${{ inputs.target_product_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publishing
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify production package and authorization
        shell: python
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          import csv, json, os
          pid = os.environ["TARGET_PRODUCT_ID"].strip()
          rows = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          row = next((r for r in rows if r["product_id"] == pid), None)
          if row is None or row["used"].strip().lower() != "yes":
              raise SystemExit("PUBLISH BLOCKED: target is not a consumed production product.")
          review = json.load(open("review_state.json", encoding="utf-8"))["products"].get(pid, {})
          if review.get("status") != "APPROVED" or review.get("approved_for_production") is not True or review.get("draft_qc") != "PASSED":
              raise SystemExit("PUBLISH BLOCKED: production authorization/QC is not approved.")
          package = f"content/{pid}/package.txt"
          if not os.path.isfile(package):
              raise SystemExit("PUBLISH BLOCKED: production package is missing.")
          print(f"Pinterest publishing preflight PASS: {pid}")

      - name: Publish approved package to Pinterest
        env:
          PUBLISH_ENABLED: "true"
          PUBLISH_MEDIUM: "false"
          PUBLISH_PINTEREST: "true"
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_IMAGE_URL: ${{ secrets.PINTEREST_IMAGE_URL }}
        run: python publish_adapter.py
