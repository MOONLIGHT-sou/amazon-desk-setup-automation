name: Production Authorization - Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'review_state.json'
      - 'products.csv'
      - '.github/workflows/production-authorization-test.yml'

permissions:
  contents: read

jobs:
  authorization:
    name: Verify production fails closed without approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Simulate unapproved production target
        run: |
          python - <<'PY'
          import csv, json
          products = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next((row for row in products if row.get('used', '').strip().lower() == 'no'), None)
          assert target is not None, 'No unused candidate exists.'

          state = json.load(open('review_state.json', encoding='utf-8'))
          review = dict(state['products'][target['product_id']])
          review['status'] = 'PENDING_HUMAN_REVIEW'
          review['approved_for_production'] = False

          authorized = review.get('status') == 'APPROVED' and review.get('approved_for_production') is True
          assert authorized is False, 'SAFETY FAILURE: unapproved product would be authorized.'
          print(f"Fail-closed authorization decision: PASS ({target['product_id']})")
          PY

      - name: Verify draft QC alone cannot authorize production
        run: |
          python - <<'PY'
          import csv, json
          products = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next(row for row in products if row.get('used', '').strip().lower() == 'no')
          state = json.load(open('review_state.json', encoding='utf-8'))
          review = dict(state['products'][target['product_id']])
          review['draft_qc'] = 'PASSED'
          review['status'] = 'PENDING_HUMAN_REVIEW'
          review['approved_for_production'] = False
          authorized = review.get('status') == 'APPROVED' and review.get('approved_for_production') is True
          assert authorized is False
          print(f"Draft QC does not imply production authorization: PASS ({target['product_id']})")
          PY

      - name: Verify no production mutation occurred
        run: |
          git diff --exit-code -- products.csv
          echo 'Production database mutation: NONE'
