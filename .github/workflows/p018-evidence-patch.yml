name: P018 Evidence Patch

on:
  push:
    paths:
      - p018.patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified P018 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          facts_path = Path('product_facts.json')
          facts = json.loads(facts_path.read_text(encoding='utf-8'))
          facts['facts']['P018'] = {
              'product_name': 'Smashtronics Premium Metal Laptop Stand - Foldable, Height Adjustable Aluminum Note Book Stand',
              'variant': 'Steel Grey',
              'asin': 'B09B4G243Y',
              'category': 'Minimal Desk Setup',
              'amazon_link': 'https://www.amazon.in/dp/B09B4G243Y?tag=moonlight0adc-21',
              'verified_on': '2026-09-09',
              'verification_method': 'Current Amazon.in-linked PriceHistory record with exact ASIN, marketplace identity, product title, model, dimensions and review count; selection identity independently corroborated by the PowerLaw Analytics Amazon India demand report.',
              'safe_facts': [
                  'smashtronics Premium Metal Laptop Stand',
                  'Steel Grey variant',
                  'Foldable laptop stand',
                  'Height-adjustable design',
                  'Aluminum/zinc-alloy construction stated in product records',
                  '20 x 4 x 2 cm listed dimensions',
                  '260 g listed weight',
                  'Two adjustable angle positions stated in product record',
                  'Suitable for laptops, keyboards and other devices as stated in product record',
                  'Portable/foldable design'
              ],
              'do_not_claim_as_current_fact': [
                  'Current price', 'Current availability', 'Guaranteed cooling performance',
                  'Guaranteed posture correction', 'Guaranteed ergonomic benefit',
                  'Universal laptop compatibility', 'Guaranteed stability or durability'
              ],
              'editorial_note': 'The exact ASIN B09B4G243Y is consistent between the candidate queue and current marketplace tracking. Use the current Amazon.in listing as the source of truth for current price, availability, compatibility and specifications. Customer ratings/reviews and historical demand are evidence, not guarantees.'
          }
          facts_path.write_text(json.dumps(facts, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          evidence_path = Path('selection_evidence.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['products']['P018'] = {
              'identity': {
                  'confidence': 'high',
                  'status': 'verified',
                  'asin': 'B09B4G243Y',
                  'variant': 'Steel Grey',
                  'verified_on': '2026-09-09',
                  'source': 'Current Amazon.in-linked PriceHistory record; exact ASIN independently matched to PowerLaw selection report'
              },
              'demand': {
                  'score': 85,
                  'confidence': 'medium',
                  'value': '107 historical daily units',
                  'verified_on': '2026-09-09',
                  'source': 'PowerLaw Analytics Amazon India Notebook Computer Stands demand report'
              },
              'review_volume': {
                  'score': 95,
                  'confidence': 'high',
                  'value': 5516,
                  'verified_on': '2026-09-09',
                  'source': 'Current Amazon.in-linked PriceHistory product record'
              },
              'rating_context': {
                  'score': 84,
                  'confidence': 'high',
                  'rating': 8.4,
                  'review_count': 5516,
                  'verified_on': '2026-09-09',
                  'source': 'Current Amazon.in-linked PriceHistory product record'
              },
              'review_themes': {
                  'score': None,
                  'confidence': 'unknown',
                  'status': 'not captured',
                  'reason': 'A reliable product-specific review count is available, but review-theme excerpts were not independently captured; content must not invent or generalize customer experiences.'
              },
              'niche_fit': {
                  'score': 95,
                  'confidence': 'high',
                  'reason': 'The exact product is a foldable, height-adjustable laptop stand and is directly relevant to a minimal laptop-centered desk setup.'
              },
              'fact_verifiability': {
                  'score': 95,
                  'confidence': 'high',
                  'verified_on': '2026-09-09',
                  'source': 'Current Amazon.in-linked PriceHistory record with exact ASIN, title, model and dimensions'
              },
              'content_potential': {
                  'score': 85,
                  'confidence': 'medium',
                  'reason': 'The product has concrete fit, footprint, folding and adjustment attributes that support a buyer-focused decision guide without unsupported performance promises.'
              }
          }
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit evidence patch and remove temporary bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm p018.patch.trigger .github/workflows/p018-evidence-patch.yml
          git add product_facts.json selection_evidence.json
          git commit -m 'Verify P018 listing evidence and facts'
          git push origin HEAD:main
