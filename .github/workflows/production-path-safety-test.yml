name: Production Path Safety - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-path:
    name: Isolated production-path verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run isolated approved-production simulation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          import main

          def file_hash(path):
              digest = hashlib.sha256()
              with open(path, "rb") as file:
                  for chunk in iter(lambda: file.read(65536), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          repo_products = Path("products.csv").read_bytes()
          repo_review = Path("review_state.json").read_bytes()
          repo_content_files = {
              str(path.relative_to("content")): file_hash(path)
              for path in Path("content").rglob("*")
              if path.is_file()
          } if Path("content").exists() else {}

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              products_path = root / "products.csv"
              review_path = root / "review_state.json"
              evidence_path = root / "selection_evidence.json"
              content_root = root / "content"

              products_path.write_bytes(repo_products)

              review = json.loads(repo_review.decode("utf-8"))
              review["products"]["P005"]["status"] = "APPROVED"
              review["products"]["P005"]["human_review"] = "APPROVED"
              review["products"]["P005"]["approved_for_production"] = True
              review_path.write_text(json.dumps(review), encoding="utf-8")
              shutil.copyfile("selection_evidence.json", evidence_path)

              main.PRODUCTS_FILE = str(products_path)
              main.REVIEW_STATE_FILE = str(review_path)
              main.SELECTION_EVIDENCE_FILE = str(evidence_path)
              main.CONTENT_DIR = str(content_root)

              os.environ["TEST_MODE"] = "false"
              os.environ["DRY_RUN"] = "false"
              os.environ["TARGET_PRODUCT_ID"] = "P005"

              main.main()

              with products_path.open(newline="", encoding="utf-8") as file:
                  rows = list(csv.DictReader(file))
              target = next((row for row in rows if row["product_id"] == "P005"), None)
              if target is None:
                  raise SystemExit("TEST FAILURE: isolated production removed P005.")

              print(f"Isolated post-run state: P005 used={target['used']!r}")
              if target["used"].strip().lower() != "yes":
                  raise SystemExit(
                      "TEST FAILURE: isolated approved production did not consume P005 "
                      f"(observed used={target['used']!r})."
                  )

              package = content_root / "P005" / "package.txt"
              if not package.is_file() or package.stat().st_size == 0:
                  raise SystemExit("TEST FAILURE: isolated production did not create the content package.")

              package_text = package.read_text(encoding="utf-8")
              required = (
                  "P005",
                  "AERYS Vintage Style Alarm Clock",
                  "https://www.amazon.in/dp/B0GL2ZFVR1?tag=moonlight0adc-21",
                  "As an Amazon Associate I earn from qualifying purchases.",
              )
              for value in required:
                  if value not in package_text:
                      raise SystemExit(f"TEST FAILURE: isolated package missing {value!r}.")

          if Path("products.csv").read_bytes() != repo_products:
              raise SystemExit("SAFETY FAILURE: repository products.csv was mutated by the isolated test.")
          if Path("review_state.json").read_bytes() != repo_review:
              raise SystemExit("SAFETY FAILURE: repository review_state.json was mutated by the isolated test.")

          current_content_files = {
              str(path.relative_to("content")): file_hash(path)
              for path in Path("content").rglob("*")
              if path.is_file()
          } if Path("content").exists() else {}
          if current_content_files != repo_content_files:
              raise SystemExit("SAFETY FAILURE: real repository content was mutated by the isolated test.")

          print("Production path safety: PASS")
          print("Verified: intelligent selection, human authorization, exact-ASIN affiliate validation, content QC, and No -> Yes mutation all work in an isolated copy.")
          print("Verified: real products.csv, review_state.json, and content files were not mutated by the test.")
          PY
