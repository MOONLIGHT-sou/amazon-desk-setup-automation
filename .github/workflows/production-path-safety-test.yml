name: Production Path Safety - Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'products.csv'
      - 'review_state.json'
      - 'selection_evidence.json'
      - 'product_facts.json'
      - 'candidate_selector.py'
      - 'selection_intelligence.py'
      - '.github/workflows/production.yml'
      - '.github/workflows/production-path-safety-test.yml'

permissions:
  contents: read

jobs:
  production-path:
    name: Isolated production-path verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run isolated approved-production simulation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          import main

          def file_hash(path):
              digest = hashlib.sha256()
              with open(path, "rb") as file:
                  for chunk in iter(lambda: file.read(65536), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def read_rows(path):
              with path.open(newline="", encoding="utf-8") as file:
                  return list(csv.DictReader(file))

          def write_rows(path, rows):
              if not rows:
                  raise SystemExit("TEST FAILURE: products.csv contains no rows.")
              fieldnames = list(rows[0].keys())
              with path.open("w", newline="", encoding="utf-8") as file:
                  writer = csv.DictWriter(file, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)

          repo_root = Path.cwd()
          repo_products = (repo_root / "products.csv").read_bytes()
          repo_review = (repo_root / "review_state.json").read_bytes()
          repo_content_files = {
              str(path.relative_to(repo_root / "content")): file_hash(path)
              for path in (repo_root / "content").rglob("*")
              if path.is_file()
          } if (repo_root / "content").exists() else {}

          repository_rows = read_rows(repo_root / "products.csv")
          target = next(
              (row for row in repository_rows if row.get("used", "").strip().lower() == "no"),
              None,
          )
          synthetic_target = False
          if target is None:
              # The production catalog can legitimately reach an all-consumed state.
              # Keep the regression test live by creating a No -> Yes candidate only
              # inside the temporary simulation directory; never alter the repository copy.
              target = repository_rows[-1]
              synthetic_target = True

          target_id = target["product_id"]
          simulation_rows = [dict(row) for row in repository_rows]
          simulation_target = next(row for row in simulation_rows if row["product_id"] == target_id)
          simulation_target["used"] = "No"
          before_products_by_id = {
              row["product_id"]: dict(row) for row in simulation_rows
          }

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              products_path = root / "products.csv"
              review_path = root / "review_state.json"
              evidence_path = root / "selection_evidence.json"
              facts_path = root / "product_facts.json"
              content_root = root / "content"

              write_rows(products_path, simulation_rows)

              review = json.loads(repo_review.decode("utf-8"))
              if target_id not in review.get("products", {}):
                  raise SystemExit(f"TEST FAILURE: review_state.json has no {target_id} entry.")
              review["products"][target_id]["status"] = "APPROVED"
              review["products"][target_id]["human_review"] = "APPROVED"
              review["products"][target_id]["approved_for_production"] = True
              review["products"][target_id]["draft_qc"] = "PASSED"
              review_path.write_text(json.dumps(review), encoding="utf-8")
              shutil.copyfile(repo_root / "selection_evidence.json", evidence_path)
              shutil.copyfile(repo_root / "product_facts.json", facts_path)

              os.environ["TEST_MODE"] = "false"
              os.environ["DRY_RUN"] = "false"
              os.environ["TARGET_PRODUCT_ID"] = target_id

              previous_cwd = Path.cwd()
              try:
                  os.chdir(root)
                  main.main()
              finally:
                  os.chdir(previous_cwd)

              after_rows = read_rows(products_path)
              after_target = next((row for row in after_rows if row.get("product_id") == target_id), None)
              if after_target is None:
                  raise SystemExit(f"TEST FAILURE: isolated production removed {target_id}.")
              if after_target.get("used", "").strip().lower() != "yes":
                  raise SystemExit(
                      f"TEST FAILURE: isolated approved production did not consume {target_id} "
                      f"(observed used={after_target.get('used')!r})."
                  )

              after_products_by_id = {row["product_id"]: dict(row) for row in after_rows}
              if set(after_products_by_id) != set(before_products_by_id):
                  raise SystemExit("SAFETY FAILURE: isolated production changed the product set.")
              for product_id, before_row in before_products_by_id.items():
                  after_row = after_products_by_id[product_id]
                  if product_id == target_id:
                      expected = dict(before_row)
                      expected["used"] = "Yes"
                      if after_row != expected:
                          raise SystemExit(
                              f"SAFETY FAILURE: {target_id} mutation was not exactly No -> Yes "
                              f"(before={before_row!r}, after={after_row!r})."
                          )
                  elif after_row != before_row:
                      raise SystemExit(
                          f"SAFETY FAILURE: product {product_id} changed during isolated production."
                      )

              package = content_root / target_id / "package.txt"
              if not package.is_file() or package.stat().st_size == 0:
                  raise SystemExit(f"TEST FAILURE: isolated production did not create {target_id} content package.")

              package_text = package.read_text(encoding="utf-8")
              facts = json.load(open(facts_path, encoding="utf-8"))["facts"][target_id]
              required = (
                  target_id,
                  facts["product_name"],
                  facts["asin"],
                  facts["amazon_link"],
                  "As an Amazon Associate I earn from qualifying purchases.",
              )
              for value in required:
                  if value not in package_text:
                      raise SystemExit(f"TEST FAILURE: isolated package missing {value!r}.")

          if (repo_root / "products.csv").read_bytes() != repo_products:
              raise SystemExit("SAFETY FAILURE: repository products.csv was mutated by the isolated test.")
          if (repo_root / "review_state.json").read_bytes() != repo_review:
              raise SystemExit("SAFETY FAILURE: repository review_state.json was mutated by the isolated test.")

          current_content_files = {
              str(path.relative_to(repo_root / "content")): file_hash(path)
              for path in (repo_root / "content").rglob("*")
              if path.is_file()
          } if (repo_root / "content").exists() else {}
          if current_content_files != repo_content_files:
              raise SystemExit("SAFETY FAILURE: real repository content was mutated by the isolated test.")

          mode = "synthetic temporary candidate" if synthetic_target else "repository unused candidate"
          print("Production path safety: PASS")
          print(f"Verified: isolated approved-production path consumed {target_id} exactly No -> Yes ({mode}).")
          print("Verified: all other isolated product rows remained unchanged.")
          print("Verified: real products.csv, review_state.json, and content files were not mutated by the isolated test.")
          PY
