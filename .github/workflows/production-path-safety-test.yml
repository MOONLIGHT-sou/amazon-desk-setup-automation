name: Production Path Safety - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-path:
    name: Isolated production-path verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run isolated approved-production simulation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          import main

          def file_hash(path):
              digest = hashlib.sha256()
              with open(path, "rb") as file:
                  for chunk in iter(lambda: file.read(65536), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def read_rows(path):
              with path.open(newline="", encoding="utf-8") as file:
                  return list(csv.DictReader(file))

          repo_root = Path.cwd()
          repo_products = (repo_root / "products.csv").read_bytes()
          repo_review = (repo_root / "review_state.json").read_bytes()
          repo_content_files = {
              str(path.relative_to(repo_root / "content")): file_hash(path)
              for path in (repo_root / "content").rglob("*")
              if path.is_file()
          } if (repo_root / "content").exists() else {}

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              products_path = root / "products.csv"
              review_path = root / "review_state.json"
              evidence_path = root / "selection_evidence.json"
              content_root = root / "content"

              products_path.write_bytes(repo_products)
              before_rows = read_rows(products_path)
              before_target = next((row for row in before_rows if row.get("product_id") == "P005"), None)
              if before_target is None:
                  raise SystemExit("TEST FAILURE: isolated fixture is missing P005.")
              if before_target.get("used", "").strip().lower() != "no":
                  raise SystemExit(
                      "TEST FAILURE: isolated fixture P005 was not initially unused "
                      f"(observed used={before_target.get('used')!r})."
                  )
              before_products_by_id = {row["product_id"]: dict(row) for row in before_rows}

              review = json.loads(repo_review.decode("utf-8"))
              review["products"]["P005"]["status"] = "APPROVED"
              review["products"]["P005"]["human_review"] = "APPROVED"
              review["products"]["P005"]["approved_for_production"] = True
              review_path.write_text(json.dumps(review), encoding="utf-8")
              shutil.copyfile(repo_root / "selection_evidence.json", evidence_path)

              os.environ["TEST_MODE"] = "false"
              os.environ["DRY_RUN"] = "false"
              os.environ["TARGET_PRODUCT_ID"] = "P005"

              # The production code intentionally uses repository-relative paths.
              # Isolate the complete filesystem view by changing into the temp repo,
              # rather than monkey-patching module globals that are also used as
              # default arguments. This exercises the real production path exactly.
              previous_cwd = Path.cwd()
              try:
                  os.chdir(root)
                  main.main()
              finally:
                  os.chdir(previous_cwd)

              after_rows = read_rows(products_path)
              after_target = next((row for row in after_rows if row.get("product_id") == "P005"), None)
              if after_target is None:
                  raise SystemExit("TEST FAILURE: isolated production removed P005.")
              if after_target.get("product_id") != "P005":
                  raise SystemExit("TEST FAILURE: isolated production returned the wrong target identity.")
              if after_target.get("used", "").strip().lower() != "yes":
                  raise SystemExit(
                      "TEST FAILURE: isolated approved production did not consume P005 "
                      f"(observed used={after_target.get('used')!r})."
                  )

              after_products_by_id = {row["product_id"]: dict(row) for row in after_rows}
              if set(after_products_by_id) != set(before_products_by_id):
                  raise SystemExit("SAFETY FAILURE: isolated production changed the product set.")
              for product_id, before_row in before_products_by_id.items():
                  after_row = after_products_by_id[product_id]
                  if product_id == "P005":
                      expected = dict(before_row)
                      expected["used"] = "Yes"
                      if after_row != expected:
                          raise SystemExit(
                              "SAFETY FAILURE: P005 mutation was not exactly No -> Yes "
                              f"(before={before_row!r}, after={after_row!r})."
                          )
                  elif after_row != before_row:
                      raise SystemExit(
                          f"SAFETY FAILURE: product {product_id} changed during isolated production."
                      )

              package = content_root / "P005" / "package.txt"
              if not package.is_file() or package.stat().st_size == 0:
                  raise SystemExit("TEST FAILURE: isolated production did not create the content package.")

              package_text = package.read_text(encoding="utf-8")
              required = (
                  "P005",
                  "AERYS Vintage Style Alarm Clock",
                  "https://www.amazon.in/dp/B0GL2ZFVR1?tag=moonlight0adc-21",
                  "As an Amazon Associate I earn from qualifying purchases.",
              )
              for value in required:
                  if value not in package_text:
                      raise SystemExit(f"TEST FAILURE: isolated package missing {value!r}.")

          if (repo_root / "products.csv").read_bytes() != repo_products:
              raise SystemExit("SAFETY FAILURE: repository products.csv was mutated by the isolated test.")
          if (repo_root / "review_state.json").read_bytes() != repo_review:
              raise SystemExit("SAFETY FAILURE: repository review_state.json was mutated by the isolated test.")

          current_content_files = {
              str(path.relative_to(repo_root / "content")): file_hash(path)
              for path in (repo_root / "content").rglob("*")
              if path.is_file()
          } if (repo_root / "content").exists() else {}
          if current_content_files != repo_content_files:
              raise SystemExit("SAFETY FAILURE: real repository content was mutated by the isolated test.")

          print("Production path safety: PASS")
          print("Verified: intelligent selection, human authorization, exact-ASIN affiliate validation, content QC, and exact isolated P005 No -> Yes mutation all work.")
          print("Verified: all other isolated product rows remain unchanged.")
          print("Verified: real products.csv, review_state.json, and content files were not mutated by the isolated test.")
          PY