name: Affiliate Link Safety - Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'affiliate_link.py'
      - 'test_affiliate_link.py'
      - 'products.csv'
      - 'product_facts.json'
      - '.github/workflows/affiliate-link-test.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify affiliate link safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run affiliate link regression
        run: python test_affiliate_link.py

      - name: Verify current unused candidate link against exact ASIN and Associate tag
        run: |
          python - <<'PY'
          import csv, json
          from affiliate_link import validate_affiliate_link

          rows = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          target = next((row for row in rows if row.get('used', '').strip().lower() == 'no'), None)
          assert target is not None, 'No unused candidate exists.'

          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts'][target['product_id']]
          assert facts.get('asin'), f"Missing ASIN evidence for {target['product_id']}"
          validate_affiliate_link(
              target['amazon_link'],
              facts['asin'],
              'moonlight0adc-21',
          )
          print(f"{target['product_id']} affiliate-link verification: PASS ({facts['asin']})")
          PY
