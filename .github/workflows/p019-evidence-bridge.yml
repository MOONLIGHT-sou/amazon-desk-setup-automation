name: P019 Evidence Integration Bridge

on:
  push:
    paths:
      - ".p019-evidence.trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Integrate verified P019 evidence only
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          p = "P019"
          asin = "B08LHTJTBB"
          name = "Dyazo 6 Angles Adjustable Aluminum Ergonomic Foldable Portable Tabletop Laptop/Desktop Riser Stand Holder (Silver)"
          link = "https://www.amazon.in/dp/B08LHTJTBB?tag=moonlight0adc-21"

          with open("products.csv", encoding="utf-8") as f:
              products = f.read()
          if f"{p}," in products:
              raise SystemExit("P019 already exists in products.csv; evidence bridge must not mutate product inventory")

          with open("product_facts.json", encoding="utf-8") as f:
              facts = json.load(f)
          with open("selection_evidence.json", encoding="utf-8") as f:
              evidence = json.load(f)

          facts.setdefault("facts", {})[p] = {
              "product_name": name,
              "variant": "Silver",
              "asin": asin,
              "category": "Minimal Desk Setup",
              "amazon_link": link,
              "verified_on": "2026-09-09",
              "verification_method": "Exact ASIN/product identity cross-checked against current indexed Amazon-linked product records.",
              "safe_facts": [
                  "Dyazo 6 Angles Adjustable Aluminum Ergonomic Foldable Portable Tabletop Laptop/Desktop Riser Stand Holder",
                  "Silver variant",
                  "ASIN B08LHTJTBB",
                  "Six-angle adjustable design as stated in current product records",
                  "Foldable and portable design",
                  "Aluminum construction stated in product records",
                  "Tabletop laptop/desktop riser stand",
                  "Model DZ 888",
                  "24 x 4 x 1.8 cm and 240 g stated in current product records"
              ],
              "do_not_claim_as_current_fact": [
                  "Current Amazon.in price",
                  "Current Amazon.in availability",
                  "Guaranteed compatibility with every laptop",
                  "Guaranteed cooling or thermal reduction",
                  "Guaranteed stability or durability",
                  "Guaranteed ergonomic or health benefit",
                  "Guaranteed review sentiment"
              ],
              "editorial_note": "Use the live Amazon.in listing as the source of truth for current price, availability and listing details. Historical demand is selection evidence only, not a current-sales claim."
          }

          evidence.setdefault("products", {})[p] = {
              "identity": {"confidence": "high", "status": "verified", "asin": asin, "variant": "Silver", "verified_on": "2026-09-09", "source": "Current indexed Amazon-linked product records"},
              "demand": {"score": 80, "confidence": "medium", "value": "99 historical daily units", "verified_on": "2026-09-09", "source": "PowerLaw Analytics Amazon India Notebook Computer Stands demand report", "source_note": "Historical selection signal only; not a current-sales claim."},
              "review_volume": {"score": None, "confidence": "unknown", "status": "not captured"},
              "rating_context": {"score": None, "confidence": "unknown", "status": "not captured"},
              "review_themes": {"score": None, "confidence": "unknown", "status": "not captured"},
              "niche_fit": {"score": 95, "confidence": "high", "reason": "A foldable adjustable laptop/tabletop riser is directly relevant to the Minimal Desk Setup niche."},
              "fact_verifiability": {"score": 90, "confidence": "high", "verified_on": "2026-09-09", "source": "Exact-ASIN current indexed product records"},
              "content_potential": {"score": 88, "confidence": "medium", "reason": "Six-angle adjustment, foldability, aluminum construction and compact tabletop use provide concrete desk-setup content angles without requiring performance guarantees."}
          }

          with open("product_facts.json", "w", encoding="utf-8") as f:
              json.dump(facts, f, ensure_ascii=False, indent=2)
              f.write("\n")
          with open("selection_evidence.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, ensure_ascii=False, indent=2)
              f.write("\n")

          Path(".p019-evidence.trigger").unlink()
          Path(".github/workflows/p019-evidence-bridge.yml").unlink()

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "product_facts.json", "selection_evidence.json", ".p019-evidence.trigger", ".github/workflows/p019-evidence-bridge.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "Add verified P019 product evidence"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
