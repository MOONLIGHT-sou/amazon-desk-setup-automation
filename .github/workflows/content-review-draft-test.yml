name: Content Review - Draft Test

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "product_facts.json"
      - "products.csv"
      - "selection_evidence.json"
      - "candidate_selector.py"
      - "selection_intelligence.py"
      - ".github/workflows/content-review-draft-test.yml"

permissions:
  contents: read

jobs:
  draft:
    name: Generate and verify current unused-product draft without production mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Snapshot repository state
        run: |
          cp products.csv /tmp/products.before.csv
          git rev-parse HEAD > /tmp/revision.before

      - name: Run content generation in TEST_MODE
        env:
          TEST_MODE: "true"
          DRY_RUN: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python main.py

      - name: Verify intelligent selection and draft identity
        run: |
          python - <<'PY'
          import csv, json
          from candidate_selector import select_candidate
          from selection_intelligence import build_report

          with open('products.csv', newline='', encoding='utf-8') as file:
              products = list(csv.DictReader(file))

          expected = next((row for row in products if row.get('used', '').strip().lower() == 'no'), None)
          assert expected is not None, 'No unused candidate exists.'

          report = build_report()
          selected = select_candidate(products, report)
          assert selected is not None, 'No eligible candidate was selected.'
          assert selected['product']['product_id'] == expected['product_id']
          assert selected['product']['used'].strip().lower() == 'no'

          product_id = expected['product_id']
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts'][product_id]
          assert facts['asin']
          assert facts['amazon_link']
          assert facts['safe_facts']

          print(f"Draft target verification: PASS ({product_id} / {selected['selection']['decision']} / {selected['selection']['confidence']} / {selected['selection']['evidence_coverage']}% / {selected['selection']['opportunity_score']})")
          PY

      - name: Verify generated draft package
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          with open('products.csv', newline='', encoding='utf-8') as file:
              target = next(row for row in csv.DictReader(file) if row.get('used', '').strip().lower() == 'no')
          product_id = target['product_id']
          facts = json.load(open('product_facts.json', encoding='utf-8'))['facts'][product_id]
          path = Path(f'.test-output/{product_id}/package.txt')
          assert path.is_file(), f'Expected TEST_MODE draft package was not created for {product_id}.'
          content = path.read_text(encoding='utf-8')

          required = [
              'PRODUCT CONTENT PACKAGE',
              f'Product ID: {product_id}',
              facts['product_name'],
              facts['variant'].split(',')[0],
              facts['asin'],
              facts['amazon_link'],
              'PINTEREST MAIN PIN',
              'PINTEREST PRODUCT PIN',
              'CONTENT QUALITY',
              'Human review before publication: REQUIRED',
              'As an Amazon Associate I earn from qualifying purchases.',
              '(paid link)',
          ]

          for item in required:
              assert item in content, f'Missing required draft content: {item!r}'

          assert 'Editorial status: This package is generated from structured product data and requires human review before publication.' in content
          assert 'TODO' not in content
          assert 'PLACEHOLDER' not in content

          print(f'Draft package verification: PASS ({product_id})')
          PY

      - name: Verify TEST_MODE did not mutate production state
        run: |
          cmp --silent products.csv /tmp/products.before.csv || {
            echo 'SAFETY FAILURE: TEST_MODE changed products.csv.'
            exit 1
          }

          if git diff --quiet -- products.csv; then
            echo 'Production database mutation check: PASS'
          else
            echo 'SAFETY FAILURE: products.csv differs after draft test.'
            git diff -- products.csv
            exit 1
          fi

          echo 'Draft test is non-production: PASS'
