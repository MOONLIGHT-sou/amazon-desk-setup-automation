name: Complete P017 Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-p017.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: complete-p017
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add P017 evidence, facts, authorization, and laptop-stand profile
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          pid = 'P017'
          asin = 'B00EU6TXC6'
          name = 'Portronics My Buddy K Portable Laptop Stand, Grey'
          category = 'Minimal Desk Setup'
          link = 'https://www.amazon.in/dp/B00EU6TXC6?tag=moonlight0adc-21'

          # products.csv: append only if P017 is not already present.
          products_path = Path('products.csv')
          with products_path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fieldnames = ['product_id','product_name','category','amazon_link','used']
          ids = {r['product_id'] for r in rows}
          if pid not in ids:
              rows.append({
                  'product_id': pid,
                  'product_name': name,
                  'category': category,
                  'amazon_link': link,
                  'used': 'No',
              })
              with products_path.open('w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames)
                  w.writeheader(); w.writerows(rows)

          facts_path = Path('product_facts.json')
          facts_doc = json.loads(facts_path.read_text(encoding='utf-8'))
          facts_doc.setdefault('facts', {})[pid] = {
              'product_name': 'Portronics My Buddy K Portable Laptop Stand with Adjustable Height, Foldable, OverHeating Protection for Laptops & MacBooks (Grey)',
              'variant': 'Grey',
              'asin': asin,
              'category': category,
              'amazon_link': link,
              'verified_on': '2026-09-08',
              'verification_method': 'Current Amazon.in-tracked PriceHistory record with exact ASIN/title/brand/model/dimensions, corroborated by an exact-ASIN product record and current product-specific review excerpts.',
              'safe_facts': [
                  'Portronics My Buddy K Portable Laptop Stand',
                  'Grey variant',
                  'My Buddy K model',
                  'Foldable laptop stand',
                  'Adjustable height/angle design',
                  'Aluminium and silicone construction as stated in product records',
                  '24 x 16 x 5.5 cm listed dimensions',
                  '270 g listed weight',
                  'Tabletop mounting',
                  'Laptop use',
                  'Supports up to 17-inch and smaller laptops as stated in product records',
                  '1-year manufacturer warranty stated in product records'
              ],
              'do_not_claim_as_current_fact': [
                  'Current price', 'Current availability',
                  'Exact number of adjustment levels/angles because sources conflict',
                  'Guaranteed posture improvement', 'Guaranteed cooling/overheating reduction',
                  'Guaranteed stability', 'Guaranteed durability',
                  'Guaranteed compatibility with every laptop'
              ],
              'editorial_note': 'Use the current Amazon.in-linked evidence as the source of truth for current price, availability, specifications and compatibility. Review themes are evidence only. Do not convert reported stability, cooling, comfort or durability experiences into guarantees.'
          }
          facts_path.write_text(json.dumps(facts_doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          evidence_path = Path('selection_evidence.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence.setdefault('products', {})[pid] = {
              'identity': {
                  'confidence': 'high', 'status': 'verified', 'asin': asin, 'variant': 'Grey',
                  'verified_on': '2026-09-08',
                  'source': 'Current Amazon.in-tracked PriceHistory record with exact ASIN/title/brand/model/dimensions, corroborated by exact-ASIN product evidence'
              },
              'demand': {
                  'score': 90, 'confidence': 'medium', 'value': 175,
                  'verified_on': '2026-09-08',
                  'source': 'PowerLaw Amazon India Notebook Computer Stands demand report dated 2024-02-14',
                  'note': 'Historical demand signal only; not treated as current purchase volume.'
              },
              'review_volume': {
                  'score': 90, 'confidence': 'high',
                  'value': 9123, 'verified_on': '2026-09-08',
                  'source': 'Current Amazon.in-tracked product record'
              },
              'rating_context': {
                  'score': 84, 'confidence': 'high', 'rating': 8.4, 'review_count': 9123,
                  'verified_on': '2026-09-08',
                  'source': 'Current Amazon.in-tracked product record; rating scale is source-specific and is not presented as an Amazon star rating.'
              },
              'review_themes': {
                  'score': 82, 'confidence': 'medium', 'status': 'captured', 'verified_on': '2026-09-08',
                  'source': 'Exact-ASIN product record with 2026 review excerpts',
                  'themes': {
                      'positive': ['compact form factor', 'sturdy construction praised by some reviewers', 'easy to carry', 'multiple height adjustments appreciated', 'non-slip behavior mentioned positively', 'value for money mentioned positively'],
                      'negative': ['one reviewer reported a short front lip', 'exact adjustment-angle count is inconsistent across sources']
                  },
                  'reason': 'Product-specific evidence is mixed. Positive and negative signals are retained and are not converted into guarantees.'
              },
              'niche_fit': {
                  'score': 95, 'confidence': 'high',
                  'reason': 'A foldable laptop stand directly supports a laptop-centered minimal desk setup and has a clear desk-footprint and portability angle.'
              },
              'fact_verifiability': {
                  'score': 95, 'confidence': 'high', 'verified_on': '2026-09-08',
                  'source': 'Current Amazon.in-tracked product record with exact ASIN, model, variant and dimensions.'
              },
              'content_potential': {
                  'score': 92, 'confidence': 'high',
                  'reason': 'Clear fit/size/portability/desk-footprint tradeoffs support an honest buyer guide without requiring unsupported performance claims.'
              }
          }
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          review_path = Path('review_state.json')
          review = json.loads(review_path.read_text(encoding='utf-8'))
          review.setdefault('products', {})[pid] = {
              'status': 'APPROVED',
              'draft_qc': 'PASSED',
              'selection': 'APPROVE',
              'human_review': 'APPROVED',
              'approved_for_production': True
          }
          review_path.write_text(json.dumps(review, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Add a dedicated laptop-stand profile before the ring-light profile.
          main_path = Path('main.py')
          main = main_path.read_text(encoding='utf-8')
          if '"laptop_stand": {' not in main:
              marker = '    "ring_light": {'
              profile = '''    "laptop_stand": {
          "keywords": ("laptop", "stand"),
          "angle": "raising or repositioning a laptop while keeping the desk footprint and portability practical",
          "fit": (
              "A laptop stand is worth evaluating when the listed dimensions, adjustment design, and laptop compatibility fit your machine and desk. "
              "The useful question is whether it improves the physical arrangement of the workspace without creating a fit or stability problem."
          ),
          "sections": (
              "laptop size and compatibility information supplied by the seller",
              "stand dimensions and available desk space",
              "adjustment range or positions stated by the seller",
              "folding, portability, and storage requirements",
              "whether the stand leaves enough room for the keyboard, mouse, and other desk items",
          ),
          "tradeoffs": (
              "A stand can free desk area or change the laptop's position, but it also adds another object to the workspace. "
              "Check the listed dimensions, laptop-size guidance, construction, and adjustment details before buying, and do not assume a particular posture, cooling, or stability outcome."
          ),
      },
'''
              if marker not in main:
                  raise SystemExit('Cannot insert laptop_stand profile: ring_light marker not found')
              main = main.replace(marker, profile + marker, 1)
              main_path.write_text(main, encoding='utf-8')

          test_path = Path('tests/test_profile_inference.py')
          test = test_path.read_text(encoding='utf-8')
          if 'test_laptop_stand_profile' not in test:
              marker = '    def test_cooling_pad_remains_cooling_pad(self):\n'
              addition = '''    def test_laptop_stand_profile(self):
          self.assert_profile(
              "P017",
              "Portronics My Buddy K Portable Laptop Stand, Grey",
              "laptop_stand",
          )

'''
              if marker not in test:
                  raise SystemExit('Cannot insert laptop-stand regression test: marker not found')
              test = test.replace(marker, addition + marker, 1)
              test_path.write_text(test, encoding='utf-8')

          # Queue remains a selection source, not an authorization source.
          print('P017 inventory/evidence/profile preparation complete')
          PY

      - name: Validate changed data and run deterministic unit tests
        run: |
          python -m unittest tests/test_candidate_queue.py -v
          python -m unittest tests/test_profile_inference.py -v

      - name: Commit prepared P017 state
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.csv product_facts.json selection_evidence.json review_state.json main.py tests/test_profile_inference.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No P017 changes needed.'
          else
            git commit -m 'feat: prepare P017 for production'
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch full TEST_MODE verification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --data '{"ref":"main"}'
          echo 'TEST_MODE workflow dispatched.'

      - name: Wait for TEST_MODE result and dispatch production P017
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            run_json=$(curl --fail-with-body --silent --show-error \
              --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10')
            status=$(python -c "import json,sys; d=json.load(sys.stdin); r=next((x for x in d['workflow_runs'] if x['head_sha']=='$(git rev-parse HEAD)'),None); print((r or {}).get('status','missing'))" <<< "$run_json")
            conclusion=$(python -c "import json,sys; d=json.load(sys.stdin); r=next((x for x in d['workflow_runs'] if x['head_sha']=='$(git rev-parse HEAD)'),None); print((r or {}).get('conclusion',''))" <<< "$run_json")
            echo "TEST_MODE status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo 'TEST_MODE failed; production dispatch blocked.'; exit 1; }
              break
            fi
            sleep 10
          done
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] || { echo 'Timed out waiting for TEST_MODE.'; exit 1; }
          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/dispatches" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --data '{"ref":"main","inputs":{"target_product_id":"P017"}}'
          echo 'Production P017 workflow dispatched after TEST_MODE passed.'
