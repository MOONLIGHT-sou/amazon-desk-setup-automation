name: Intelligent TEST_MODE - Candidate Selection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-intelligent-test
  cancel-in-progress: true

jobs:
  intelligent-test:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      DRY_RUN: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record repository state
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/status-before.txt
          cp products.csv /tmp/products-before.csv
          find content -type f -print | sort > /tmp/content-before.txt

      - name: Evaluate intelligence and run TEST_MODE
        shell: bash
        run: |
          set -euo pipefail
          python main.py

      - name: Verify intelligent TEST_MODE safety
        shell: bash
        run: |
          set -euo pipefail

          if ! cmp -s products.csv /tmp/products-before.csv; then
            echo "SAFETY FAILURE: products.csv changed during intelligent TEST_MODE."
            diff -u /tmp/products-before.csv products.csv || true
            exit 1
          fi

          find content -type f -print | sort > /tmp/content-after.txt
          if ! cmp -s /tmp/content-before.txt /tmp/content-after.txt; then
            echo "SAFETY FAILURE: production content tree changed during intelligent TEST_MODE."
            diff -u /tmp/content-before.txt /tmp/content-after.txt || true
            exit 1
          fi

          if [ -d .test-output ]; then
            if find .test-output -type f -print -quit | grep -q .; then
              echo "SAFETY FAILURE: TEST_MODE generated content despite no eligible candidate."
              find .test-output -type f -print
              exit 1
            fi
          fi

          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "SAFETY FAILURE: unexpected working-tree changes detected."
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

          echo "Intelligent TEST_MODE safety: PASS"
          echo "Current repository has no eligible unused candidate, so execution stopped without content generation or state mutation."
