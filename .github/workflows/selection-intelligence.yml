name: Selection Intelligence - Test

on:
  workflow_dispatch:
  push:
    paths:
      - "selection_intelligence.py"
      - "selection_evidence.json"
      - "products.csv"
      - ".github/workflows/selection-intelligence.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate product evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run selection intelligence
        env:
          SELECTION_REPORT: /tmp/selection_report.json
        run: python selection_intelligence.py

      - name: Verify safety decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json

          products = list(csv.DictReader(open('products.csv', newline='', encoding='utf-8')))
          report = json.load(open('/tmp/selection_report.json', encoding='utf-8'))
          results = {item['product_id']: item for item in report['results']}

          expected = next((row for row in products if row.get('used', '').strip().lower() == 'no'), None)
          assert expected is not None, 'No unused candidate exists.'
          target = results[expected['product_id']]
          assert target['decision'] in {'APPROVE', 'REVIEW'}, target
          assert target['evidence_coverage'] >= 60.0
          assert target['confidence'] in {'medium', 'high'}
          print(
              f"Current candidate intelligence: PASS ({expected['product_id']} / "
              f"{target['decision']} / {target['confidence']} / "
              f"{target['evidence_coverage']}% / {target['opportunity_score']})"
          )

          # Historical consumed products may have weaker coverage, but their
          # evidence must still be structurally evaluable and never fabricate approval.
          for product in products:
              result = results[product['product_id']]
              assert result['product_id'] == product['product_id']
              assert 0 <= result['evidence_coverage'] <= 100
              assert 0 <= result['opportunity_score'] <= 100
          print('Selection intelligence safety checks: PASS')
          PY
