name: Selection Intelligence - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate product evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run selection intelligence
        env:
          SELECTION_REPORT: /tmp/selection_report.json
        run: python selection_intelligence.py

      - name: Verify safety decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report = json.load(open('/tmp/selection_report.json', encoding='utf-8'))
          results = {item['product_id']: item for item in report['results']}

          assert results['P004']['decision'] in {'HOLD', 'REVIEW', 'APPROVE'}
          assert results['P005']['decision'] == 'HOLD'
          assert results['P005']['evidence_coverage'] < 60
          print('Selection intelligence safety checks: PASS')
          PY
