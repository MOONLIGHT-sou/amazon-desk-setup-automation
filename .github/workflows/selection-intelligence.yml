name: Selection Intelligence - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate product evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run selection intelligence
        env:
          SELECTION_REPORT: /tmp/selection_report.json
        run: python selection_intelligence.py

      - name: Verify safety decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report = json.load(open('/tmp/selection_report.json', encoding='utf-8'))
          results = {item['product_id']: item for item in report['results']}

          # P004 remains the known-good calibration case.
          assert results['P004']['decision'] == 'REVIEW'
          assert results['P004']['confidence'] == 'medium'
          assert results['P004']['evidence_coverage'] == 65.0

          # P005 now has exact-ASIN review-theme evidence in addition to its
          # previously verified identity, demand, rating context, review volume,
          # niche fit, and verifiable facts. The review evidence is mixed and
          # conservatively scored, so P005 must remain REVIEW rather than APPROVE.
          assert results['P005']['decision'] == 'REVIEW'
          assert results['P005']['confidence'] == 'medium'
          assert results['P005']['evidence_coverage'] == 100.0
          assert results['P005']['opportunity_score'] == 73.3
          assert results['P005']['decision'] != 'APPROVE'

          print('Selection intelligence safety checks: PASS')
          PY
