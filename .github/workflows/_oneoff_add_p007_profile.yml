name: One-off P007 profile repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: add P007 approved product profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reviewed cooling-pad profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          if '"cooling_pad": {' in text:
              raise SystemExit('cooling_pad profile already exists')
          marker = '\n\n\ndef load_products'
          profile = '''\n    "cooling_pad": {\n        "keywords": ("cooling", "pad"),\n        "angle": "adding a laptop cooling accessory while keeping the desk footprint and cable setup under control",\n        "fit": (\n            "A laptop cooling pad is worth evaluating when you want a dedicated platform for the laptop and the listed design fits your machine and workspace. "\n            "The decision should be based on the seller's specifications and your actual desk layout, not on a promise of guaranteed temperature or performance improvement."\n        ),\n        "sections": (\n            "listed dimensions and available desk space",\n            "laptop size and compatibility information supplied by the seller",\n            "USB power and port requirements",\n            "fan and stand features stated by the seller",\n            "whether the stand position and cable routing fit the desk",\n        ),\n        "tradeoffs": (\n            "A cooling pad adds another device, cable, and occupied surface area to the desk. "\n            "Check the listing's dimensions, compatibility, power requirements, and stated features before buying, and do not assume a specific temperature reduction or gaming-performance gain."\n        ),\n    },'''
          if marker not in text:
              raise SystemExit('profile insertion marker not found')
          text = text.replace(marker, profile + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python -m py_compile main.py
          grep -q '"cooling_pad": {' main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'chore: add P007 approved product profile'
          git push
# trigger repair check
