name: Production - Amazon Desk Setup Automation

on:
  workflow_dispatch:
    inputs:
      target_product_id:
        description: "Product ID expected to be consumed; must be the current first-unused product"
        required: true
        default: "P004"
        type: string

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Production Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify production target and repository state
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "SAFETY STOP: Production may only run from main."
            exit 1
          fi

          python - <<'PY'
          import csv
          import os

          target_id = os.environ["TARGET_PRODUCT_ID"].strip()

          with open("products.csv", newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          target = next((row for row in rows if row["product_id"] == target_id), None)

          if target is None:
              raise SystemExit(f"SAFETY STOP: target product {target_id} was not found.")

          if target["used"].strip().lower() != "no":
              raise SystemExit(f"SAFETY STOP: target {target_id} is already {target['used']!r}.")

          first_unused = next((row for row in rows if row["used"].strip().lower() == "no"), None)

          if first_unused is None:
              raise SystemExit("SAFETY STOP: no unused products exist.")

          if first_unused["product_id"] != target_id:
              raise SystemExit(
                  "SAFETY STOP: target does not match the first unused product. "
                  f"Target={target_id}, first_unused={first_unused['product_id']}."
              )

          print(f"Production preflight PASS: {target_id} is the first unused product and is No.")
          PY

          if ! git diff --quiet; then
            echo "SAFETY STOP: checkout is not clean."
            git status --short
            exit 1
          fi

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Production preflight complete."

  produce:
    name: Production Execution
    needs: preflight
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: write

    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify main has not moved
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"
          WORKFLOW_SHA="${GITHUB_SHA}"

          if [ "$CURRENT_MAIN" != "$WORKFLOW_SHA" ]; then
            echo "SAFETY STOP: main changed after this production run was started."
            echo "Workflow SHA: $WORKFLOW_SHA"
            echo "Current main: $CURRENT_MAIN"
            exit 1
          fi

          echo "Repository revision check: PASS"

      - name: Verify target is still the current first-unused product
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import os

          target_id = os.environ["TARGET_PRODUCT_ID"].strip()

          with open("products.csv", newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          first_unused = next((row for row in rows if row["used"].strip().lower() == "no"), None)

          if first_unused is None:
              raise SystemExit("SAFETY STOP: no unused product remains.")

          if first_unused["product_id"] != target_id:
              raise SystemExit(
                  "SAFETY STOP: target changed before execution. "
                  f"Requested={target_id}, current_first_unused={first_unused['product_id']}."
              )

          print(f"Final target check: PASS ({target_id} is still first-unused and No)")
          PY

      - name: Run automation in production mode
        env:
          TEST_MODE: "false"
          DRY_RUN: "false"
        run: python main.py

      - name: Verify target content and exact database mutation
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          CONTENT_FILE="content/${TARGET_PRODUCT_ID}/package.txt"
          test -f "$CONTENT_FILE"

          python - <<'PY'
          import csv
          import os
          import subprocess

          target_id = os.environ["TARGET_PRODUCT_ID"].strip()
          content_file = os.path.join("content", target_id, "package.txt")
          content = open(content_file, encoding="utf-8").read()

          before_text = subprocess.check_output(["git", "show", "HEAD:products.csv"], text=True)
          before = list(csv.DictReader(before_text.splitlines()))

          with open("products.csv", newline="", encoding="utf-8") as file:
              after = list(csv.DictReader(file))

          before_by_id = {row["product_id"]: row for row in before}
          after_by_id = {row["product_id"]: row for row in after}

          if set(before_by_id) != set(after_by_id):
              raise SystemExit("SAFETY FAILURE: product IDs changed.")
          if len(before) != len(after):
              raise SystemExit("SAFETY FAILURE: products.csv row count changed.")

          if target_id not in before_by_id:
              raise SystemExit("SAFETY FAILURE: target did not exist before execution.")
          if before_by_id[target_id]["used"].strip().lower() != "no":
              raise SystemExit("SAFETY FAILURE: target was not No before execution.")
          if after_by_id[target_id]["used"].strip().lower() != "yes":
              raise SystemExit("SAFETY FAILURE: target did not change No -> Yes.")

          for product_id in before_by_id:
              for column in before_by_id[product_id]:
                  if product_id == target_id and column == "used":
                      continue
                  if before_by_id[product_id][column] != after_by_id[product_id][column]:
                      raise SystemExit(
                          f"SAFETY FAILURE: unexpected products.csv change at {product_id}.{column}."
                      )

          target = after_by_id[target_id]
          required = (target_id, target["product_name"], target["category"], target["amazon_link"])
          for value in required:
              if value not in content:
                  raise SystemExit(f"SAFETY FAILURE: generated content is missing {value!r}.")

          for marker in ("MEDIUM", "PINTEREST MAIN PIN", "PINTEREST PRODUCT PIN", "CONTENT QUALITY"):
              if marker not in content:
                  raise SystemExit(f"SAFETY FAILURE: generated content is missing {marker!r}.")

          print(f"Exact production verification: PASS ({target_id} No -> Yes)")
          PY

      - name: Verify only expected files changed
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          CONTENT_FILE="content/${TARGET_PRODUCT_ID}/package.txt"
          UNEXPECTED="$(git status --porcelain=v1 --untracked-files=all | awk -v expected="$CONTENT_FILE" '
            !($0 ~ /^ M products\.csv$/ || $0 ~ ("^\\?\\? " expected "$")) { print }
          ')"

          if [ -n "$UNEXPECTED" ]; then
            echo "SAFETY FAILURE: unexpected repository changes detected:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if git diff --quiet -- products.csv; then
            echo "SAFETY FAILURE: products.csv did not change."
            exit 1
          fi

          test -f "$CONTENT_FILE"
          echo "Changed-file scope verification: PASS"

      - name: Final main check before commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"

          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "SAFETY STOP: main changed during production execution."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $CURRENT_MAIN"
            exit 1
          fi

          echo "Final repository revision check: PASS"

      - name: Commit production result
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.csv "content/${TARGET_PRODUCT_ID}/package.txt"

          if git diff --cached --quiet; then
            echo "SAFETY FAILURE: nothing staged for production commit."
            exit 1
          fi

          git commit -m "Consume ${TARGET_PRODUCT_ID} and publish generated content"

      - name: Final main check before push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"

          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "SAFETY STOP: main changed before production push."
            echo "Workflow SHA: $GITHUB_SHA"
            echo "Current main: $CURRENT_MAIN"
            exit 1
          fi

          echo "Final pre-push repository revision check: PASS"

      - name: Push production result
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Production commit pushed successfully."
