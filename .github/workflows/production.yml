name: Production - Amazon Desk Setup Automation

on:
  workflow_dispatch:
    inputs:
      target_product_id:
        description: "Product ID expected to be consumed; must be the current first-unused product"
        required: true
        default: "P007"
        type: string

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Production Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify production target and repository state
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "SAFETY STOP: Production may only run from main."
            exit 1
          fi

          python - <<'PY'
          import csv
          import json
          import os

          target_id = os.environ["TARGET_PRODUCT_ID"].strip()

          with open("products.csv", newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))

          target = next((row for row in rows if row["product_id"] == target_id), None)
          if target is None:
              raise SystemExit(f"SAFETY STOP: target product {target_id} was not found.")
          if target["used"].strip().lower() != "no":
              raise SystemExit(f"SAFETY STOP: target {target_id} is already {target['used']!r}.")

          first_unused = next((row for row in rows if row["used"].strip().lower() == "no"), None)
          if first_unused is None:
              raise SystemExit("SAFETY STOP: no unused products exist.")
          if first_unused["product_id"] != target_id:
              raise SystemExit(
                  "SAFETY STOP: target does not match the first unused product. "
                  f"Target={target_id}, first_unused={first_unused['product_id']}."
              )

          try:
              state = json.load(open("review_state.json", encoding="utf-8"))
              review = state["products"][target_id]
          except (OSError, KeyError, TypeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"SAFETY STOP: review authorization is unavailable or invalid: {exc}")

          if review.get("status") != "APPROVED":
              raise SystemExit(
                  f"SAFETY STOP: target {target_id} is not human-approved. "
                  f"Observed status={review.get('status')!r}."
              )
          if review.get("approved_for_production") is not True:
              raise SystemExit(
                  f"SAFETY STOP: target {target_id} is not approved_for_production."
              )

          if review.get("draft_qc") != "PASSED":
              raise SystemExit(
                  f"SAFETY STOP: target {target_id} draft QC is not PASSED."
              )

          print(f"Production target preflight: PASS ({target_id})")
          PY

      - name: Verify main has not moved since dispatch
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_SHA="${GITHUB_SHA}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$DISPATCH_SHA" ]; then
            echo "SAFETY STOP: main moved after dispatch."
            echo "Dispatch SHA: $DISPATCH_SHA"
            echo "Current SHA:  $CURRENT_SHA"
            exit 1
          fi
          echo "Main revision stability: PASS ($CURRENT_SHA)"

  production:
    name: Production Execution
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify main has not moved
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "SAFETY STOP: checked-out main revision differs from dispatch revision."
            exit 1
          fi
          echo "Exact reviewed revision: PASS ($CURRENT_SHA)"

      - name: Re-verify human review authorization
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          target_id = os.environ["TARGET_PRODUCT_ID"]
          state = json.load(open("review_state.json", encoding="utf-8"))
          review = state["products"][target_id]
          assert review.get("status") == "APPROVED", "SAFETY STOP: human approval missing."
          assert review.get("human_review") == "APPROVED", "SAFETY STOP: human review is not APPROVED."
          assert review.get("approved_for_production") is True, "SAFETY STOP: production authorization missing."
          assert review.get("draft_qc") == "PASSED", "SAFETY STOP: draft QC is not PASSED."
          print(f"Human authorization re-check: PASS ({target_id})")
          PY

      - name: Verify target is still the current first-unused product
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import os
          target_id = os.environ["TARGET_PRODUCT_ID"]
          rows = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          target = next((row for row in rows if row["product_id"] == target_id), None)
          assert target is not None, f"SAFETY STOP: target {target_id} not found."
          assert target["used"].strip().lower() == "no", f"SAFETY STOP: target {target_id} already consumed."
          first_unused = next((row for row in rows if row["used"].strip().lower() == "no"), None)
          assert first_unused is not None, "SAFETY STOP: no unused product exists."
          assert first_unused["product_id"] == target_id, (
              f"SAFETY STOP: target {target_id} is not first unused; "
              f"current first unused is {first_unused['product_id']}."
          )
          print(f"Current first-unused target: PASS ({target_id})")
          PY

      - name: Run automation in production mode
        env:
          TEST_MODE: "false"
          DRY_RUN: "false"
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python main.py

      - name: Verify target content and exact database mutation
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          target_id = os.environ["TARGET_PRODUCT_ID"]
          rows = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          target = next((row for row in rows if row["product_id"] == target_id), None)
          assert target is not None, f"SAFETY STOP: target {target_id} disappeared."
          assert target["used"].strip().lower() == "yes", (
              f"SAFETY STOP: expected {target_id} used=Yes after production; observed {target['used']!r}."
          )

          package = Path("content") / target_id / "package.txt"
          assert package.is_file() and package.stat().st_size > 0, (
              f"SAFETY STOP: production package missing for {target_id}."
          )
          content = package.read_text(encoding="utf-8")
          assert target_id in content, "SAFETY STOP: package identity missing."
          assert "As an Amazon Associate I earn from qualifying purchases." in content
          print(f"Exact production mutation and package verification: PASS ({target_id} No -> Yes)")
          PY

      - name: Verify only expected files changed
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          CONTENT_FILE="content/${TARGET_PRODUCT_ID}/package.txt"
          UNEXPECTED="$(git status --porcelain=v1 --untracked-files=all | while IFS= read -r line; do
            case "$line" in
              " M products.csv") ;;
              "?? $CONTENT_FILE") ;;
              *) printf '%s\n' "$line" ;;
            esac
          done)"
          if [ -n "$UNEXPECTED" ]; then
            echo "SAFETY FAILURE: unexpected repository changes detected:"
            echo "$UNEXPECTED"
            exit 1
          fi
          if git diff --quiet -- products.csv; then
            echo "SAFETY FAILURE: products.csv did not change."
            exit 1
          fi
          test -f "$CONTENT_FILE"
          echo "Changed-file scope verification: PASS"

      - name: Final main check before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "SAFETY STOP: main changed before commit."
            exit 1
          fi
          echo "Final main check before commit: PASS ($LOCAL_SHA)"

      - name: Commit production result
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.csv "content/${TARGET_PRODUCT_ID}/package.txt"
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Consume ${TARGET_PRODUCT_ID} and publish generated content"

      - name: Final main check before push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          EXPECTED_PARENT="$(git rev-parse origin/main)"
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          if [ "$ACTUAL_PARENT" != "$EXPECTED_PARENT" ]; then
            echo "SAFETY STOP: main changed before push."
            echo "Expected parent: $EXPECTED_PARENT"
            echo "Actual parent:   $ACTUAL_PARENT"
            exit 1
          fi
          echo "Final main check before push: PASS ($EXPECTED_PARENT)"

      - name: Push production result
        run: git push origin HEAD:main
