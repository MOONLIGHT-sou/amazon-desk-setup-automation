name: Production - Amazon Desk Setup Automation

on:
  workflow_dispatch:
    inputs:
      target_product_id:
        description: "Product ID expected to be consumed; must be the current first-unused product"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amazon-desk-setup-production
  cancel-in-progress: false

env:
  LISTING_QC_MAX_AGE_DAYS: "14"

jobs:
  preflight:
    name: Production Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify target, authorization, and fresh listing QC
        shell: python
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          import csv, json, os, re
          from datetime import date
          target_id = os.environ["TARGET_PRODUCT_ID"].strip()
          max_age = int(os.environ["LISTING_QC_MAX_AGE_DAYS"])
          if not target_id:
              raise SystemExit("SAFETY STOP: target_product_id must not be empty.")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("SAFETY STOP: Production may only run from main.")
          with open("products.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          target = next((r for r in rows if r["product_id"] == target_id), None)
          first_unused = next((r for r in rows if r["used"].strip().lower() == "no"), None)
          if target is None:
              raise SystemExit(f"SAFETY STOP: target {target_id} was not found.")
          if target["used"].strip().lower() != "no":
              raise SystemExit(f"SAFETY STOP: target {target_id} is already used.")
          if first_unused is None or first_unused["product_id"] != target_id:
              raise SystemExit("SAFETY STOP: target is not the current first-unused product.")
          try:
              state = json.load(open("review_state.json", encoding="utf-8"))
              review = state["products"][target_id]
          except (OSError, KeyError, TypeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"SAFETY STOP: review authorization invalid: {exc}")
          if review.get("status") != "APPROVED" or review.get("approved_for_production") is not True or review.get("draft_qc") != "PASSED":
              raise SystemExit("SAFETY STOP: human authorization/draft QC gate failed.")
          try:
              evidence = json.load(open("selection_evidence.json", encoding="utf-8"))
              listing = evidence["products"][target_id]["current_listing_qc"]
          except (OSError, KeyError, TypeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"SAFETY STOP: current-listing QC unavailable: {exc}")
          match = re.search(r"/dp/([A-Z0-9]{10})", target["amazon_link"], re.I)
          expected_asin = match.group(1).upper() if match else ""
          if listing.get("status") != "PASSED" or listing.get("asin", "").upper() != expected_asin:
              raise SystemExit("SAFETY STOP: listing QC is not a matching PASSED ASIN record.")
          fresh = re.search(r"crawled\s+(\d{4}-\d{2}-\d{2})", listing.get("freshness", ""), re.I)
          if not fresh:
              raise SystemExit("SAFETY STOP: listing QC freshness date is missing or invalid.")
          age = (date.today() - date.fromisoformat(fresh.group(1))).days
          if age < 0 or age > max_age:
              raise SystemExit(f"SAFETY STOP: listing QC is {age} days old; maximum is {max_age}.")
          print(f"Preflight PASS: {target_id}; ASIN={expected_asin}; QC age={age} days")
      - name: Verify checkout is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git status --porcelain --untracked-files=all

  produce:
    name: Production Execution
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify main has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "SAFETY STOP: main changed."; exit 1; }
      - name: Re-verify human authorization
        shell: python
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          import json, os
          pid = os.environ["TARGET_PRODUCT_ID"].strip()
          try:
              review = json.load(open("review_state.json", encoding="utf-8"))["products"][pid]
          except (OSError, KeyError, TypeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"SAFETY STOP: review authorization invalid: {exc}")
          if review.get("status") != "APPROVED" or review.get("approved_for_production") is not True or review.get("draft_qc") != "PASSED":
              raise SystemExit("SAFETY STOP: authorization/draft QC changed.")
      - name: Re-verify fresh listing QC
        shell: python
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          import csv, json, os, re
          from datetime import date
          pid = os.environ["TARGET_PRODUCT_ID"].strip()
          max_age = int(os.environ["LISTING_QC_MAX_AGE_DAYS"])
          rows = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          target = next((r for r in rows if r["product_id"] == pid), None)
          listing = json.load(open("selection_evidence.json", encoding="utf-8"))["products"][pid]["current_listing_qc"]
          match = re.search(r"/dp/([A-Z0-9]{10})", target["amazon_link"], re.I)
          expected = match.group(1).upper() if match else ""
          fresh = re.search(r"crawled\s+(\d{4}-\d{2}-\d{2})", listing.get("freshness", ""), re.I)
          if target is None or listing.get("status") != "PASSED" or listing.get("asin", "").upper() != expected or not fresh:
              raise SystemExit("SAFETY STOP: listing QC is missing, stale, or does not match the Amazon ASIN.")
          age = (date.today() - date.fromisoformat(fresh.group(1))).days
          if age < 0 or age > max_age:
              raise SystemExit(f"SAFETY STOP: listing QC is {age} days old; maximum is {max_age}.")
          print(f"Listing QC re-check PASS: {pid}; ASIN={expected}; age={age} days")
      - name: Verify target is still first-unused
        shell: python
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          import csv, os
          pid = os.environ["TARGET_PRODUCT_ID"].strip()
          rows = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          first = next((r for r in rows if r["used"].strip().lower() == "no"), None)
          if first is None or first["product_id"] != pid:
              raise SystemExit("SAFETY STOP: target is no longer first-unused.")
      - name: Run automation in production mode
        env:
          TEST_MODE: "false"
          DRY_RUN: "false"
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: python main.py
      - name: Verify exact production mutation and content
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          CONTENT_FILE="content/${TARGET_PRODUCT_ID}/package.txt"
          test -f "$CONTENT_FILE"
          python - <<'PY'
          import csv, os, subprocess
          pid = os.environ["TARGET_PRODUCT_ID"].strip()
          before = list(csv.DictReader(subprocess.check_output(["git","show","HEAD:products.csv"], text=True).splitlines()))
          after = list(csv.DictReader(open("products.csv", newline="", encoding="utf-8")))
          b = {r["product_id"]: r for r in before}; a = {r["product_id"]: r for r in after}
          if set(b) != set(a) or len(b) != len(a): raise SystemExit("SAFETY FAILURE: product structure changed.")
          if b[pid]["used"].lower() != "no" or a[pid]["used"].lower() != "yes": raise SystemExit("SAFETY FAILURE: target was not exactly No -> Yes.")
          for product_id in b:
              for column in b[product_id]:
                  if product_id == pid and column == "used": continue
                  if b[product_id][column] != a[product_id][column]: raise SystemExit(f"SAFETY FAILURE: unexpected change at {product_id}.{column}.")
          content = open(os.path.join("content", pid, "package.txt"), encoding="utf-8").read()
          for value in (pid, a[pid]["product_name"], a[pid]["category"], a[pid]["amazon_link"]):
              if value not in content: raise SystemExit(f"SAFETY FAILURE: content missing {value!r}.")
          print(f"Exact production verification PASS: {pid} No -> Yes")
          PY
      - name: Verify only expected files changed
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          CONTENT_FILE="content/${TARGET_PRODUCT_ID}/package.txt"
          UNEXPECTED="$(git status --porcelain=v1 --untracked-files=all | while IFS= read -r line; do case "$line" in " M products.csv"|"?? $CONTENT_FILE") ;; *) printf '%s\n' "$line" ;; esac; done)"
          if [ -n "$UNEXPECTED" ]; then echo "SAFETY FAILURE: unexpected changes:"; echo "$UNEXPECTED"; exit 1; fi
          git diff --quiet -- products.csv && { echo "SAFETY FAILURE: products.csv did not change."; exit 1; }
          test -f "$CONTENT_FILE"
      - name: Final main check before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "SAFETY STOP: main changed during production."; exit 1; }
      - name: Commit production result
        shell: bash
        env:
          TARGET_PRODUCT_ID: ${{ inputs.target_product_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.csv "content/${TARGET_PRODUCT_ID}/package.txt"
          git diff --cached --quiet && { echo "SAFETY FAILURE: nothing staged."; exit 1; }
          git commit -m "Consume ${TARGET_PRODUCT_ID} and publish generated content"
      - name: Final main check before push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "SAFETY STOP: main changed before push."; exit 1; }
      - name: Push production result
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
